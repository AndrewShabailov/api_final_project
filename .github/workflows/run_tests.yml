name: Python autotests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: run autotests
    steps:
      - name: Checkout autotests
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --alluredir=allure-results
        continue-on-error: true

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Setup Java
        uses: actions/setup-java@v4
        if: always()
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d gh-pages/last-history ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/last-history/* allure-results/history/ || true
          fi
          npm install -g allure-commandline --silent
          allure generate allure-results --clean -o allure-report

      - name: Prepare report for publishing
        if: always()
        run: |
          mkdir -p allure-history
          if [ -d gh-pages ]; then
            cp -r gh-pages/* allure-history/ 2>/dev/null || true
            rm -rf allure-history/.git
          fi
          BUILD="${{ github.run_number }}"
          cp -r allure-report "allure-history/${BUILD}"
          mkdir -p allure-history/last-history
          cp -r allure-report/history/* allure-history/last-history/ 2>/dev/null || true
          echo "<meta http-equiv=\"refresh\" content=\"0; url=./${BUILD}/index.html\">" > allure-history/index.html

      - name: Publish Allure report to Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages
